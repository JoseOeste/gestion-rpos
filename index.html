<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control RPOS Ripley</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 20px; 
    }
    
    body::before {
      content: "PROPIEDAD DE JOSE MANUEL JARA - RPOS";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 32px;
      font-weight: bold;
      color: rgba(0, 0, 0, 0.025);
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
    }

    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: white; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      position: relative; 
    }
    
    /* Logo Ripley */
    .logo-container { text-align: center; margin-bottom: 20px; }
    .ripley-logo-box { display: inline-flex; align-items: center; background-color: #000; padding: 12px 20px; border-radius: 4px; position: relative; overflow: hidden; box-sizing: border-box; max-width: 100%; }
    .ripley-text { color: #ffffff; font-family: 'Times New Roman', Times, serif; font-size: 32px; letter-spacing: 14px; margin-right: -14px; font-weight: normal; user-select: none; }
    .ripley-dotcom { writing-mode: vertical-rl; transform: rotate(180deg); color: #000; font-weight: bold; font-size: 16px; margin-left: 12px; font-family: Arial, sans-serif; user-select: none; }
    .ripley-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(to right, #d9252e 0%, #d9252e 12%, #792a7e 12%, #792a7e 24%, #f6cd00 24%, #f6cd00 36%, #cccccc 36%, #cccccc 48%, #d9252e 48%, #d9252e 60%, #792a7e 60%, #792a7e 72%, #f6cd00 72%, #f6cd00 84%, #d9252e 84%, #d9252e 100%); }

    h2 { text-align: center; color: #1a252f; margin-bottom: 20px; margin-top: 10px; }
    
    /* Pestañas (Tabs) superiores */
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; }
    .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; background: #ecf0f1; border: none; cursor: pointer; color: #7f8c8d; transition: all 0.2s; user-select: none; }
    .tab-btn.active { background: white; color: #2c3e50; border-bottom: 3px solid #3498db; }
    .tab-btn:first-child.active { border-bottom-color: #2980b9; }
    .tab-btn:last-child.active { border-bottom-color: #27ae60; }

    .input-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
    
    input { width: 100%; padding: 12px; font-size: 16px !important; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; outline: none; -webkit-appearance: none; }
    input:focus { border-color: #3498db; background-color: #eaf2f8; }
    input:disabled { background-color: #f2f4f4; cursor: not-allowed; }
    
    .status { padding: 14px; font-weight: bold; text-align: center; border-radius: 6px; margin-bottom: 20px; background-color: #ebf5fb; color: #2980b9; border: 1px solid #aed6f1; cursor: pointer; user-select: none; }
    .status-step2 { background-color: #fef9e7; color: #7d6608; border-color: #f9e79f; }
    .success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
    .danger { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }

    .btn-guardar { background-color: #27ae60; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; transition: background 0.2s; }
    .btn-guardar:hover { background-color: #219653; }
    .btn-guardar:disabled { background-color: #bdc3c7; cursor: not-allowed; }

    .watermark { text-align: center; font-size: 11px; color: #95a5a6; margin-top: 25px; text-transform: uppercase; font-weight: 600; user-select: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGOTIPO RIPLEY EMBEBIDO -->
    <div class="logo-container">
      <div style="display: inline-flex; align-items: center;">
        <div class="ripley-logo-box">
          <span class="ripley-text">RIPLEY</span>
          <div class="ripley-bar"></div>
        </div>
        <span class="ripley-dotcom">.com</span>
      </div>
    </div>

    <h2>Control RPOS Ripley</h2>

    <!-- Pestañas de Navegación -->
    <div class="tabs">
      <button id="tabRetiro" class="tab-btn active" onclick="cambiarTab('retiro')">📥 Retiro RPOS</button>
      <button id="tabEntrega" class="tab-btn" onclick="cambiarTab('entrega')">📤 Entrega RPOS</button>
    </div>

    <div id="statusBox" class="status" onclick="resetFormulario()" title="Haz clic para reiniciar">
      Paso 1: Ingresa N° del EQUIPO
    </div>

    <!-- Campo Equipo -->
    <div class="input-group">
      <label for="inputEquipo">N° de Equipo:</label>
      <input type="text" inputmode="numeric" id="inputEquipo" placeholder="Pistolear equipo..." autocomplete="off">
    </div>

    <!-- Campo RUT (Solo visible/activo en Retiro) -->
    <div class="input-group" id="groupRut">
      <label for="inputRut">RUT de la Persona:</label>
      <input type="text" inputmode="numeric" id="inputRut" placeholder="Ej: 123456789 o -11 para K" disabled autocomplete="off">
    </div>

    <!-- Botón Guardar -->
    <button id="btnGuardar" class="btn-guardar" onclick="confirmarYGuardar()" disabled>💾 Guardar Registro</button>

    <div class="watermark">
      PROPIEDAD DE JOSE MANUEL JARA - RPOS
    </div>
  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbymgKY0pIwUb26P0hmYa4UKBE3Phhr6uGbkf23X5qN_U82v_i0HGktXycP07sfbutf3_w/exec"; 
    
    let modoActual = "retiro";
    let timerReset = null;

    const tabRetiro = document.getElementById("tabRetiro");
    const tabEntrega = document.getElementById("tabEntrega");
    const inputEquipo = document.getElementById("inputEquipo");
    const inputRut = document.getElementById("inputRut");
    const groupRut = document.getElementById("groupRut");
    const statusBox = document.getElementById("statusBox");
    const btnGuardar = document.getElementById("btnGuardar");

    function cambiarTab(modo) {
      if (timerReset) clearTimeout(timerReset);
      modoActual = modo;

      tabRetiro.classList.remove("active");
      tabEntrega.classList.remove("active");

      if (modo === "retiro") {
        tabRetiro.classList.add("active");
        groupRut.style.display = "block";
      } else {
        tabEntrega.classList.add("active");
        groupRut.style.display = "none";
      }

      resetFormulario();
    }

    function resetFormulario() {
      if (timerReset) clearTimeout(timerReset);

      inputEquipo.value = "";
      inputRut.value = "";
      inputEquipo.disabled = false;
      inputRut.disabled = true;
      btnGuardar.innerText = "💾 Guardar Registro";

      if (modoActual === "retiro") {
        statusBox.innerText = "Paso 1: Ingresa N° del EQUIPO";
        btnGuardar.disabled = true;
      } else {
        statusBox.innerText = "Ingresa el N° EQUIPO a devolver";
        btnGuardar.disabled = false;
      }
      statusBox.className = "status";

      setTimeout(() => inputEquipo.focus(), 50);
    }

    function limpiarTexto(str) {
      return str ? str.trim().toUpperCase() : "";
    }

    // Función para formatear RUT chileno automáticamente mientras se escribe
    function formatearRutChileno(valor) {
      let limpio = valor.toUpperCase().replace(/[^0-9K]/g, "");
      if (limpio === "") return "";
      
      let cuerpo = "";
      let dv = "";
      
      if (limpio.endsWith("11") && limpio.length > 3) {
        cuerpo = limpio.slice(0, -2);
        dv = "11";
      } else {
        cuerpo = limpio.slice(0, -1);
        dv = limpio.slice(-1);
      }
      
      if (limpio.length === 1 || (limpio.length === 2 && dv === "11")) {
        return limpio;
      }
      
      let cuerpoFormateado = "";
      while (cuerpo.length > 3) {
        cuerpoFormateado = "." + cuerpo.slice(-3) + cuerpoFormateado;
        cuerpo = cuerpo.slice(0, -3);
      }
      cuerpoFormateado = cuerpo + cuerpoFormateado;
      
      return cuerpoFormateado + "-" + dv;
    }

    inputRut.addEventListener("input", function() {
      let valorActual = inputRut.value;
      inputRut.value = formatearRutChileno(valorActual);

      if (modoActual === "retiro") {
        btnGuardar.disabled = (inputRut.value.trim() === "");
      }
    });

    function procesarEquipoRetiro() {
      if (inputEquipo.disabled) return;
      const val = limpiarTexto(inputEquipo.value);
      if (val !== "") {
        inputEquipo.value = val;
        inputEquipo.disabled = true;
        inputRut.disabled = false;
        inputRut.focus();
        statusBox.innerText = "Paso 2: Ingresa tu RUT (si termina en K usa -11)";
        statusBox.className = "status status-step2";
        if (inputRut.value.trim() !== "") {
          btnGuardar.disabled = false;
        }
      } else {
        statusBox.innerText = "Falta equipo";
        statusBox.className = "status danger";
      }
    }

    inputEquipo.addEventListener("input", function() {
      const val = inputEquipo.value.trim();
      if (modoActual === "entrega") {
        btnGuardar.disabled = (val === "");
        if (val !== "") {
          statusBox.innerText = "Equipo listo. Presiona Guardar o Enter";
          statusBox.className = "status status-step2";
        }
      }
    });

    inputEquipo.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const valEquipo = limpiarTexto(inputEquipo.value);
        if (valEquipo === "") {
          statusBox.innerText = "Falta equipo";
          statusBox.className = "status danger";
          return;
        }

        if (modoActual === "retiro") {
          procesarEquipoRetiro();
        } else {
          confirmarYGuardar();
        }
      }
    });

    inputEquipo.addEventListener("blur", function() {
      if (modoActual === "retiro" && !inputEquipo.disabled) {
        const val = limpiarTexto(inputEquipo.value);
        if (val !== "") {
          procesarEquipoRetiro();
        }
      }
    });

    inputRut.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (inputRut.value.trim() !== "") {
          confirmarYGuardar();
        }
      }
    });

    function confirmarYGuardar() {
      const equipo = limpiarTexto(inputEquipo.value);
      let rut = limpiarTexto(inputRut.value);

      if (modoActual === "retiro") {
        if (equipo === "" || rut === "") {
          statusBox.innerText = "Falta RUT o equipo";
          statusBox.className = "status danger";
          return;
        }
      } else {
        if (equipo === "") {
          statusBox.innerText = "Falta equipo";
          statusBox.className = "status danger";
          return;
        }
      }

      if (rut.endsWith("-11")) {
        rut = rut.slice(0, -3) + "-K";
      }

      // Bloquear controles y mostrar estado de carga
      inputEquipo.disabled = true;
      inputRut.disabled = true;
      btnGuardar.disabled = true;
      btnGuardar.innerText = "⏳ Guardando...";

      statusBox.innerText = "Procesando registro en el servidor...";
      statusBox.className = "status";

      // Generar fecha estrictamente con barras (/) y zona horaria de Santiago
      const ahora = new Date();
      const opciones = { timeZone: "America/Santiago", hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      const partesFecha = new Intl.DateTimeFormat('es-CL', opciones).formatToParts(ahora);
      
      let d = partesFecha.find(p => p.type === 'day').value;
      let m = partesFecha.find(p => p.type === 'month').value;
      let y = partesFecha.find(p => p.type === 'year').value;
      let h = partesFecha.find(p => p.type === 'hour').value;
      let min = partesFecha.find(p => p.type === 'minute').value;
      let s = partesFecha.find(p => p.type === 'second').value;
      
      const fechaConBarras = `${d}/${m}/${y} ${h}:${min}:${s}`;

      const payload = {
        accion: modoActual,
        equipo: equipo,
        rut: (modoActual === "retiro") ? rut : "",
        fecha: fechaConBarras
      };

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la red");
        return response.json();
      })
      .then(res => {
        if (res.status === "OK") {
          statusBox.innerText = res.mensaje || "¡Registro exitoso!";
          statusBox.className = "status success";
        } else {
          statusBox.innerText = res.mensaje || "Atención: No se pudo registrar";
          statusBox.className = "status danger";
        }
        timerReset = setTimeout(resetFormulario, 2000);
      })
      .catch(err => {
        statusBox.innerText = "Error de conexión con el servidor";
        statusBox.className = "status danger";
        console.error(err);
        timerReset = setTimeout(resetFormulario, 3000);
      });
    }

    // Parche anti-zoom para celulares
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', function() {
        setTimeout(() => {
          window.scrollTo(0, 0);
          document.body.scrollTop = 0;
        }, 50);
      }, { passive: true });
    });

    window.onload = () => resetFormulario();
  </script>
</body>
</html>
