<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control RPOS Ripley</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a252f; margin-bottom: 20px; }
    
    .menu-box { display: flex; flex-direction: column; gap: 15px; }
    .btn-menu { padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; text-align: center; transition: background 0.2s; }
    .btn-retiro { background-color: #2980b9; }
    .btn-retiro:hover { background-color: #2471a3; }
    .btn-entrega { background-color: #27ae60; }
    .btn-entrega:hover { background-color: #219653; }
    .btn-volver { background-color: #7f8c8d; margin-top: 10px; }
    .btn-volver:hover { background-color: #707b7c; }

    .view-section { display: none; }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
    
    input { width: 100%; padding: 12px; font-size: 16px !important; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #3498db; background-color: #eaf2f8; }
    
    .status { padding: 14px; font-weight: bold; text-align: center; border-radius: 6px; margin-bottom: 20px; background-color: #ebf5fb; color: #2980b9; border: 1px solid #aed6f1; }
    .success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
    .danger { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }

    .btn-guardar { background-color: #27ae60; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-bottom: 10px; transition: background 0.2s; }
    .btn-guardar:hover { background-color: #219653; }
    .btn-guardar:disabled { background-color: #bdc3c7; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <!-- MENÚ PRINCIPAL -->
    <div id="viewMenu" class="menu-box">
      <h2>Gestión de Equipos RPOS</h2>
      <button class="btn-menu btn-retiro" onclick="abrirModulo('retiro')">📥 Retiro RPOS</button>
      <button class="btn-menu btn-entrega" onclick="abrirModulo('entrega')">📤 Entrega RPOS</button>
    </div>

    <!-- MÓDULO FORMULARIO -->
    <div id="viewForm" class="view-section">
      <h2 id="formTitle">Retiro RPOS</h2>

      <div id="statusBox" class="status">
        Paso 1: Pistolea el código del EQUIPO
      </div>

      <div class="input-group">
        <label for="inputEquipo">N° de Equipo:</label>
        <input type="text" id="inputEquipo" placeholder="Pistolear equipo..." autocomplete="off">
      </div>

      <div class="input-group" id="groupRut">
        <label for="inputRut">RUT de la Persona:</label>
        <input type="text" id="inputRut" placeholder="Esperando equipo..." disabled autocomplete="off">
      </div>

      <!-- Botón de Guardar -->
      <button id="btnGuardar" class="btn-guardar" onclick="confirmarYGuardar()" disabled>💾 Guardar Registro</button>
      <button class="btn-menu btn-volver" onclick="mostrarMenu()" style="width: 100%;">← Volver al Menú</button>
    </div>
  </div>

  <script>
    // URL de tu Web App de Google Apps Script
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwdavfXoehjCXFE-HZhZUYHUah1BrTXjI61tmbQKwyUb73GO6CCUuFsLOdFaGVds7sKaw/exec"; 
    
    let accionActual = "retiro";
    let timerReset = null;

    const viewMenu = document.getElementById("viewMenu");
    const viewForm = document.getElementById("viewForm");
    const formTitle = document.getElementById("formTitle");
    const inputEquipo = document.getElementById("inputEquipo");
    const inputRut = document.getElementById("inputRut");
    const groupRut = document.getElementById("groupRut");
    const statusBox = document.getElementById("statusBox");
    const btnGuardar = document.getElementById("btnGuardar");

    function abrirModulo(modo) {
      accionActual = modo;
      viewMenu.style.display = "none";
      viewForm.style.display = "block";

      if (modo === "retiro") {
        formTitle.innerText = "Retiro RPOS (Estado: Retirado)";
        formTitle.style.color = "#2980b9";
        groupRut.style.display = "block";
      } else {
        formTitle.innerText = "Entrega RPOS (Estado: Entregado)";
        formTitle.style.color = "#27ae60";
        groupRut.style.display = "none"; // Oculta el campo RUT en entrega
      }

      resetFormulario();
    }

    function mostrarMenu() {
      if (timerReset) clearTimeout(timerReset);
      viewForm.style.display = "none";
      viewMenu.style.display = "flex";
    }

    function resetFormulario() {
      if (timerReset) clearTimeout(timerReset);

      inputEquipo.value = "";
      inputRut.value = "";
      inputEquipo.disabled = false;
      inputRut.disabled = true;
      btnGuardar.disabled = true;
      btnGuardar.innerText = "💾 Guardar Registro";

      if (accionActual === "retiro") {
        statusBox.innerText = "Paso 1: Pistolea o escribe el código del EQUIPO";
      } else {
        statusBox.innerText = "Pistolea o escribe el código del EQUIPO a devolver";
        btnGuardar.disabled = false; // En entrega se habilita directo al escribir el equipo
      }
      statusBox.className = "status";

      setTimeout(() => inputEquipo.focus(), 50);
    }

    function limpiarTexto(str) {
      return str ? str.trim().toUpperCase() : "";
    }

    // Eventos para el campo Equipo
    inputEquipo.addEventListener("input", function() {
      const valor = inputEquipo.value.trim();
      if (accionActual === "entrega") {
        btnGuardar.disabled = (valor === "");
        if (valor !== "") {
          statusBox.innerText = "Equipo listo. Presiona Guardar o Enter";
        }
      }
    });

    inputEquipo.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const valorEquipo = limpiarTexto(inputEquipo.value);
        if (valorEquipo === "") return;

        if (accionActual === "retiro") {
          inputEquipo.disabled = true;
          inputRut.disabled = false;
          inputRut.focus();
          statusBox.innerText = "Paso 2: Pistolea o escribe el RUT de la persona";
        } else {
          // Si es entrega y presiona enter, ejecuta el guardado directo
          confirmarYGuardar();
        }
      }
    });

    // Eventos para el campo RUT (Solo retiro)
    inputRut.addEventListener("input", function() {
      if (accionActual === "retiro") {
        btnGuardar.disabled = (inputRut.value.trim() === "");
      }
    });

    inputRut.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (inputRut.value.trim() !== "") {
          confirmarYGuardar();
        }
      }
    });

    // Función principal que envía los datos y evita que el botón se quede pegado
    function confirmarYGuardar() {
      const equipo = limpiarTexto(inputEquipo.value);
      const rut = limpiarTexto(inputRut.value);

      if (accionActual === "retiro" && (equipo === "" || rut === "")) return;
      if (accionActual === "entrega" && equipo === "") return;

      // Bloquear controles e indicar carga
      inputEquipo.disabled = true;
      if (accionActual === "retiro") inputRut.disabled = true;
      btnGuardar.disabled = true;
      btnGuardar.innerText = "⏳ Guardando...";

      statusBox.innerText = "Procesando registro en el servidor...";
      statusBox.className = "status";

      const payload = {
        accion: accionActual,
        equipo: equipo,
        rut: (accionActual === "retiro") ? rut : "", // Envía vacío si es entrega
        fecha: new Date().toLocaleString("es-CL", { timeZone: "America/Santiago" })
      };

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la red");
        return response.json();
      })
      .then(res => {
        if (res.status === "OK") {
          statusBox.innerText = res.mensaje || "¡Registro exitoso!";
          statusBox.className = "status success";
        } else {
          statusBox.innerText = res.mensaje || "Atención: No se pudo registrar";
          statusBox.className = "status danger";
        }
        // Se asegura de reactivar y limpiar el formulario pase lo que pase
        timerReset = setTimeout(resetFormulario, 2000);
      })
      .catch(err => {
        statusBox.innerText = "Error de conexión con el servidor";
        statusBox.className = "status danger";
        console.error(err);
        timerReset = setTimeout(resetFormulario, 3000);
      });
    }
  </script>
</body>
</html>
