  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 40px 20px; 
    }
    
    /* Marca de agua de fondo tenue */
    body::before {
      content: "PROPIEDAD DE JOSE MANUEL JARA - RPOS";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 32px;
      font-weight: bold;
      color: rgba(0, 0, 0, 0.025);
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
    }

    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: white; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      position: relative;
    }

    /* Estilo para el logotipo centrado */
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-img {
      max-width: 220px;
      height: auto;
      display: inline-block;
    }

    h2 { 
      text-align: center; 
      color: #1a252f; 
      margin-top: 0;
      margin-bottom: 25px; 
    }
    
    .menu-box { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }
    .btn-menu { 
      padding: 18px; 
      font-size: 18px; 
      font-weight: bold; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: background-color 0.2s, transform 0.1s; 
    }
    .btn-menu:active {
      transform: scale(0.98);
    }
    .btn-retiro { background-color: #2980b9; }
    .btn-retiro:hover { background-color: #1f618d; }
    .btn-entrega { background-color: #27ae60; }
    .btn-entrega:hover { background-color: #1e8449; }
    
    .btn-guardar {
      background-color: #2c3e50;
      color: white;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-guardar:hover { background-color: #1a252f; }
    .btn-guardar:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .btn-volver { 
      background-color: #7f8c8d; 
      margin-top: 10px; 
      padding: 12px; 
      width: 100%; 
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-volver:hover { background-color: #626d6e; }

    .view-section { display: none; }
    .input-group { margin-bottom: 20px; }
    label { 
      display: block; 
      font-weight: bold; 
      margin-bottom: 8px; 
      color: #34495e; 
    }
    input { 
      width: 100%; 
      padding: 12px; 
      font-size: 16px; 
      border: 2px solid #bdc3c7; 
      border-radius: 6px; 
      box-sizing: border-box; 
      outline: none; 
      transition: border-color 0.2s;
    }
    input:focus { 
      border-color: #3498db; 
      background-color: #eaf2f8; 
    }
    input:disabled {
      background-color: #f2f4f4;
      cursor: not-allowed;
    }
    
    .status { 
      padding: 14px; 
      font-weight: bold; 
      text-align: center; 
      border-radius: 6px; 
      margin-bottom: 20px; 
      background-color: #ebf5fb; 
      color: #2980b9; 
      border: 1px solid #aed6f1; 
      cursor: pointer;
      user-select: none;
    }
    .status-step2 {
      background-color: #fef9e7;
      color: #7d6608;
      border-color: #f9e79f;
    }
    .success { 
      background-color: #d4edda; 
      color: #155724; 
      border-color: #c3e6cb; 
    }
    .danger { 
      background-color: #f8d7da; 
      color: #721c24; 
      border-color: #f5c6cb; 
    }

    /* Marca de agua de pie de página */
    .watermark {
      text-align: center;
      font-size: 11px;
      color: #a0aec0;
      margin-top: 25px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      user-select: none;
    }
  </style>

    <!-- MENÚ PRINCIPAL -->
    <div id="viewMenu" class="menu-box">
      <h2>Gestión de Equipos RPOS</h2>
      <button class="btn-menu btn-retiro" onclick="abrirModulo('retiro')">Retiro RPOS</button>
      <button class="btn-menu btn-entrega" onclick="abrirModulo('entrega')">Entrega RPOS</button>
    </div>

    <!-- MÓDULO FORMULARIO -->
    <div id="viewForm" class="view-section">
      <h2 id="formTitle">Retiro RPOS</h2>

      <div id="statusBox" class="status" onclick="resetFormulario()" title="Haz clic para reiniciar">
        Paso 1: Pistolea o escribe el código del EQUIPO
      </div>

      <div class="input-group">
        <label for="inputEquipo">N° de Equipo:</label>
        <input type="text" id="inputEquipo" placeholder="Pistolear o escribir equipo..." autocomplete="off">
      </div>

      <div class="input-group" id="groupRut">
        <label for="inputRut">RUT de la Persona:</label>
        <input type="text" id="inputRut" placeholder="Esperando equipo..." disabled autocomplete="off">
      </div>

      <button id="btnGuardar" class="btn-guardar" onclick="confirmarYGuardar()" disabled>💾 Guardar Registro</button>
      <button class="btn-volver" onclick="mostrarMenu()">← Volver al Menú</button>
    </div>

    <!-- MARCA DE AGUA VISIBLE -->
    <div class="watermark">
      Desarrollado por Jose Manuel Jara Barbe &copy; 2026
    </div>

  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbymgKY0pIwUb26P0hmYa4UKBE3Phhr6uGbkf23X5qN_U82v_i0HGktXycP07sfbutf3_w/exec"; 
    
    let accionActual = "retiro";
    let timerReset = null;

    const viewMenu = document.getElementById("viewMenu");
    const viewForm = document.getElementById("viewForm");
    const formTitle = document.getElementById("formTitle");
    const inputEquipo = document.getElementById("inputEquipo");
    const inputRut = document.getElementById("inputRut");
    const groupRut = document.getElementById("groupRut");
    const statusBox = document.getElementById("statusBox");
    const btnGuardar = document.getElementById("btnGuardar");

    function abrirModulo(modo) {
      accionActual = modo;
      viewMenu.style.display = "none";
      viewForm.style.display = "block";

      if (modo === "retiro") {
        formTitle.innerText = "Retiro RPOS (Estado: Retirado)";
        formTitle.style.color = "#2980b9";
        groupRut.style.display = "block";
      } else {
        formTitle.innerText = "Entrega RPOS (Estado: Entregado)";
        formTitle.style.color = "#27ae60";
        groupRut.style.display = "none";
      }

      resetFormulario();
    }

    function mostrarMenu() {
      if (timerReset) clearTimeout(timerReset);
      viewForm.style.display = "none";
      viewMenu.style.display = "flex";
    }

    function resetFormulario() {
      if (timerReset) clearTimeout(timerReset);

      inputEquipo.value = "";
      inputRut.value = "";
      inputEquipo.disabled = false;
      inputRut.disabled = true;
      btnGuardar.disabled = true;
      btnGuardar.innerText = "💾 Guardar Registro";

      if (accionActual === "retiro") {
        statusBox.innerText = "Paso 1: Pistolea o escribe el código del EQUIPO";
      } else {
        statusBox.innerText = "Pistolea o escribe el código del EQUIPO a devolver";
      }
      statusBox.className = "status";

      setTimeout(() => inputEquipo.focus(), 50);
    }

    function limpiarTexto(str) {
      return str.trim().toUpperCase();
    }

    function procesarEquipo() {
      if (inputEquipo.disabled) return;
      const valorEquipo = limpiarTexto(inputEquipo.value);

      if (valorEquipo !== "") {
        inputEquipo.value = valorEquipo;

        if (accionActual === "retiro") {
          inputEquipo.disabled = true;
          inputRut.disabled = false;
          statusBox.innerText = "Paso 2: Pistolea o escribe el RUT de la persona";
          statusBox.className = "status status-step2";
          
          if (inputRut.value.trim() !== "") {
            btnGuardar.disabled = false;
          } else {
            inputRut.focus();
          }
        } else {
          btnGuardar.disabled = false;
          statusBox.innerText = "Haz clic en 'Guardar Registro' o presiona ENTER";
          statusBox.className = "status status-step2";
        }
      }
    }

    inputEquipo.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        procesarEquipo();
        if (accionActual === "entrega" && inputEquipo.value.trim() !== "") {
          confirmarYGuardar();
        }
      }
    });

    inputEquipo.addEventListener("blur", function() {
      procesarEquipo();
    });

    inputEquipo.addEventListener("input", function() {
      if (accionActual === "entrega") {
        btnGuardar.disabled = (inputEquipo.value.trim() === "");
      }
    });

    inputRut.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        confirmarYGuardar();
      }
    });

    inputRut.addEventListener("input", function() {
      if (accionActual === "retiro") {
        btnGuardar.disabled = (inputRut.value.trim() === "");
      }
    });

    function confirmarYGuardar() {
      const equipo = limpiarTexto(inputEquipo.value);
      const rut = limpiarTexto(inputRut.value);

      if (accionActual === "retiro" && (equipo === "" || rut === "")) return;
      if (accionActual === "entrega" && equipo === "") return;

      if (!btnGuardar.disabled) {
        inputEquipo.disabled = true;
        inputRut.disabled = true;
        btnGuardar.disabled = true;
        btnGuardar.innerText = "⏳ Guardando...";

        statusBox.innerText = "Verificando y guardando...";
        statusBox.className = "status";

        guardarRegistro(equipo, rut);
      }
    }

    function guardarRegistro(equipo, rut) {
      const payload = {
        accion: accionActual,
        equipo: equipo,
        rut: rut,
        fecha: new Date().toLocaleString("es-CL", { timeZone: "America/Santiago" })
      };

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la respuesta de la red");
        return response.json();
      })
      .then(res => {
        if (res.status === "OK") {
          statusBox.innerText = res.mensaje || "¡Registro exitoso!";
          statusBox.className = "status success";
          timerReset = setTimeout(resetFormulario, 2000);
        } else {
          statusBox.innerText = res.mensaje || "Atención: No se pudo registrar";
          statusBox.className = "status danger";
          timerReset = setTimeout(resetFormulario, 4000);
        }
      })
      .catch(err => {
        statusBox.innerText = "Error de conexión con el servidor";
        statusBox.className = "status danger";
        console.error(err);
        timerReset = setTimeout(resetFormulario, 3500);
      });
    }
  </script>
