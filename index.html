<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión RPOS</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 40px 20px; 
    }
    
    body::before {
      content: "PROPIEDAD DE JOSE MANUEL JARA - RPOS";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 32px;
      font-weight: bold;
      color: rgba(0, 0, 0, 0.025);
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
    }

    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: white; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      position: relative;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .ripley-logo-box {
      display: inline-flex;
      align-items: center;
      background-color: #000;
      padding: 12px 20px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      max-width: 100%;
    }
    .ripley-text {
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 32px;
      letter-spacing: 14px;
      margin-right: -14px;
      font-weight: normal;
      user-select: none;
    }
    .ripley-dotcom {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      margin-left: 12px;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    .ripley-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(to right, 
        #d9252e 0%, #d9252e 12%, 
        #792a7e 12%, #792a7e 24%, 
        #f6cd00 24%, #f6cd00 36%, 
        #cccccc 36%, #cccccc 48%, 
        #d9252e 48%, #d9252e 60%, 
        #792a7e 60%, #792a7e 72%, 
        #f6cd00 72%, #f6cd00 84%, 
        #d9252e 84%, #d9252e 100%
      );
    }

    h2 { 
      text-align: center; 
      color: #1a252f; 
      margin-top: 15px;
      margin-bottom: 20px; 
    }

    /* PESTAÑAS (TABS) */
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #ecf0f1;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #7f8c8d;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      user-select: none;
      font-size: 16px;
    }
    .tab.active-retiro {
      color: #2980b9;
      border-bottom-color: #2980b9;
    }
    .tab.active-entrega {
      color: #27ae60;
      border-bottom-color: #27ae60;
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    .input-group { margin-bottom: 20px; }
    label { 
      display: block; 
      font-weight: bold; 
      margin-bottom: 8px; 
      color: #34495e; 
    }
    
    input { 
      width: 100%; 
      padding: 12px; 
      font-size: 16px; 
      border: 2px solid #bdc3c7; 
      border-radius: 6px; 
      box-sizing: border-box; 
      outline: none; 
      transition: border-color 0.2s;
    }
    input:focus { 
      border-color: #3498db; 
      background-color: #eaf2f8; 
    }
    input:disabled {
      background-color: #f2f4f4;
      cursor: not-allowed;
    }
    
    .btn-guardar {
      color: white;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-guardar.retiro { background-color: #2980b9; }
    .btn-guardar.retiro:hover { background-color: #1f618d; }
    .btn-guardar.entrega { background-color: #27ae60; }
    .btn-guardar.entrega:hover { background-color: #1e8449; }
    
    .btn-guardar:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .status { 
      padding: 14px; 
      font-weight: bold; 
      text-align: center; 
      border-radius: 6px; 
      margin-bottom: 20px; 
      background-color: #ebf5fb; 
      color: #2980b9; 
      border: 1px solid #aed6f1; 
      cursor: pointer;
      user-select: none;
    }
    .status-step2 {
      background-color: #fef9e7;
      color: #7d6608;
      border-color: #f9e79f;
    }
    .success { 
      background-color: #d4edda; 
      color: #155724; 
      border-color: #c3e6cb; 
    }
    .danger { 
      background-color: #f8d7da; 
      color: #721c24; 
      border-color: #f5c6cb; 
    }

    .watermark {
      text-align: center;
      font-size: 11px;
      color: #a0aec0;
      margin-top: 25px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGOTIPO RIPLEY -->
    <div class="logo-container">
      <div style="display: inline-flex; align-items: center;">
        <div class="ripley-logo-box">
          <span class="ripley-text">RIPLEY</span>
          <div class="ripley-bar"></div>
        </div>
        <span class="ripley-dotcom">.com</span>
      </div>
    </div>

    <h2>Gestión de Equipos RPOS</h2>

    <!-- SISTEMA DE PESTAÑAS -->
    <div class="tabs">
      <div id="tabRetiro" class="tab active-retiro" onclick="cambiarTab('retiro')">Retiro RPOS</div>
      <div id="tabEntrega" class="tab" onclick="cambiarTab('entrega')">Entrega RPOS</div>
    </div>

    <!-- SECCIÓN RETIRO -->
    <div id="seccionRetiro" class="form-section active">
      <div id="statusRetiro" class="status" onclick="resetFormulario('retiro')" title="Haz clic para reiniciar">
        Paso 1: Pistolea o escribe el código del EQUIPO
      </div>

      <div class="input-group">
        <label for="inputEquipoRetiro">N° de Equipo:</label>
        <input type="text" id="inputEquipoRetiro" placeholder="Pistolear o escribir equipo..." autocomplete="off">
      </div>

      <div class="input-group">
        <label for="inputRutRetiro">RUT de la Persona:</label>
        <input type="text" id="inputRutRetiro" placeholder="Esperando equipo..." disabled autocomplete="off">
      </div>

      <button id="btnGuardarRetiro" class="btn-guardar retiro" onclick="confirmarYGuardar('retiro')" disabled>💾 Guardar Retiro</button>
    </div>

    <!-- SECCIÓN ENTREGA -->
    <div id="seccionEntrega" class="form-section">
      <div id="statusEntrega" class="status status-step2" onclick="resetFormulario('entrega')" title="Haz clic para reiniciar">
        Pistolea o escribe el código del EQUIPO a devolver
      </div>

      <div class="input-group">
        <label for="inputEquipoEntrega">N° de Equipo a Devolver:</label>
        <input type="text" id="inputEquipoEntrega" placeholder="Pistolear o escribir equipo..." autocomplete="off">
      </div>

      <button id="btnGuardarEntrega" class="btn-guardar entrega" onclick="confirmarYGuardar('entrega')" disabled>💾 Guardar Entrega</button>
    </div>

    <div class="watermark">
      Desarrollado por Jose Manuel Jara Barbe &copy; 2026
    </div>

  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxpfCexOF52uR31ooxi3r0Zliw-FYM92gghnxp2DtOECr24Ev9vRtRSL0OfoTazBvjVGw/exec"; 
    
    let timerResetRetiro = null;
    let timerResetEntrega = null;

    function cambiarTab(modo) {
      const tabRetiro = document.getElementById("tabRetiro");
      const tabEntrega = document.getElementById("tabEntrega");
      const seccionRetiro = document.getElementById("seccionRetiro");
      const seccionEntrega = document.getElementById("seccionEntrega");

      if (modo === "retiro") {
        tabRetiro.className = "tab active-retiro";
        tabEntrega.className = "tab";
        seccionRetiro.classList.add("active");
        seccionEntrega.classList.remove("active");
        resetFormulario("retiro");
      } else {
        tabEntrega.className = "tab active-entrega";
        tabRetiro.className = "tab";
        seccionEntrega.classList.add("active");
        seccionRetiro.classList.remove("active");
        resetFormulario("entrega");
      }
    }

    function resetFormulario(modo) {
      if (modo === "retiro") {
        if (timerResetRetiro) clearTimeout(timerResetRetiro);
        const inputEq = document.getElementById("inputEquipoRetiro");
        const inputRt = document.getElementById("inputRutRetiro");
        const btnG = document.getElementById("btnGuardarRetiro");
        const statusR = document.getElementById("statusRetiro");

        inputEq.value = "";
        inputRt.value = "";
        inputEq.disabled = false;
        inputRt.disabled = true;
        btnG.disabled = true;
        statusR.innerText = "Paso 1: Pistolea o escribe el código del EQUIPO";
        statusR.className = "status";
        setTimeout(() => inputEq.focus(), 50);
      } else {
        if (timerResetEntrega) clearTimeout(timerResetEntrega);
        const inputEqE = document.getElementById("inputEquipoEntrega");
        const btnGE = document.getElementById("btnGuardarEntrega");
        const statusE = document.getElementById("statusEntrega");

        inputEqE.value = "";
        inputEqE.disabled = false;
        btnGE.disabled = true;
        statusE.innerText = "Pistolea o escribe el código del EQUIPO a devolver";
        statusE.className = "status status-step2";
        setTimeout(() => inputEqE.focus(), 50);
      }
    }

    function limpiarTexto(str) {
      return str.trim().toUpperCase();
    }

    // --- LÓGICA RETIRO ---
    const inputEquipoRetiro = document.getElementById("inputEquipoRetiro");
    const inputRutRetiro = document.getElementById("inputRutRetiro");
    const btnGuardarRetiro = document.getElementById("btnGuardarRetiro");
    const statusRetiro = document.getElementById("statusRetiro");

    function procesarEquipoRetiro() {
      const val = limpiarTexto(inputEquipoRetiro.value);
      if (val !== "") {
        inputEquipoRetiro.value = val;
        if (!inputEquipoRetiro.disabled) {
          inputEquipoRetiro.disabled = true;
          inputRutRetiro.disabled = false;
          statusRetiro.innerText = "Paso 2: Pistolea o escribe el RUT de la persona";
          statusRetiro.className = "status status-step2";
          inputRutRetiro.focus();
        }
      }
    }

    inputEquipoRetiro.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        procesarEquipoRetiro();
      }
    });
    inputEquipoRetiro.addEventListener("blur", procesarEquipoRetiro);

    inputRutRetiro.addEventListener("input", function() {
      btnGuardarRetiro.disabled = (inputRutRetiro.value.trim() === "");
    });

    inputRutRetiro.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        confirmarYGuardar("retiro");
      }
    });

    // --- LÓGICA ENTREGA ---
    const inputEquipoEntrega = document.getElementById("inputEquipoEntrega");
    const btnGuardarEntrega = document.getElementById("btnGuardarEntrega");
    const statusEntrega = document.getElementById("statusEntrega");

    inputEquipoEntrega.addEventListener("input", function() {
      const val = inputEquipoEntrega.value.trim();
      btnGuardarEntrega.disabled = (val === "");
    });

    inputEquipoEntrega.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (inputEquipoEntrega.value.trim() !== "") {
          confirmarYGuardar("entrega");
        }
      }
    });

    // --- GUARDAR ---
    function confirmarYGuardar(modo) {
      if (modo === "retiro") {
        const equipo = limpiarTexto(inputEquipoRetiro.value);
        const rut = limpiarTexto(inputRutRetiro.value);
        if (!equipo || !rut || btnGuardarRetiro.disabled) return;

        inputEquipoRetiro.disabled = true;
        inputRutRetiro.disabled = true;
        btnGuardarRetiro.disabled = true;
        btnGuardarRetiro.innerText = "⏳ Guardando...";
        statusRetiro.innerText = "Verificando y guardando...";
        statusRetiro.className = "status";

        enviarPeticion("retiro", equipo, rut);
      } else {
        const equipo = limpiarTexto(inputEquipoEntrega.value);
        if (!equipo || btnGuardarEntrega.disabled) return;

        inputEquipoEntrega.disabled = true;
        btnGuardarEntrega.disabled = true;
        btnGuardarEntrega.innerText = "⏳ Guardando...";
        statusEntrega.innerText = "Verificando y guardando...";
        statusEntrega.className = "status";

        enviarPeticion("entrega", equipo, "");
      }
    }

    function enviarPeticion(accion, equipo, rut) {
      const payload = {
        accion: accion,
        equipo: equipo,
        rut: rut
      };

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(response => {
        if (!response.ok) throw new Error("Error en la red");
        return response.json();
      })
      .then(res => {
        if (accion === "retiro") {
          if (res.status === "OK") {
            statusRetiro.innerText = res.mensaje || "¡Registro exitoso!";
            statusRetiro.className = "status success";
            timerResetRetiro = setTimeout(() => resetFormulario("retiro"), 2000);
          } else {
            statusRetiro.innerText = res.mensaje || "Atención: No se pudo registrar";
            statusRetiro.className = "status danger";
            timerResetRetiro = setTimeout(() => resetFormulario("retiro"), 4000);
          }
        } else {
          if (res.status === "OK") {
            statusEntrega.innerText = res.mensaje || "¡Entrega exitosa!";
            statusEntrega.className = "status success";
            timerResetEntrega = setTimeout(() => resetFormulario("entrega"), 2000);
          } else {
            statusEntrega.innerText = res.mensaje || "Atención: No se pudo registrar";
            statusEntrega.className = "status danger";
            timerResetEntrega = setTimeout(() => resetFormulario("entrega"), 4000);
          }
        }
      })
      .catch(err => {
        if (accion === "retiro") {
          statusRetiro.innerText = "Error de conexión con el servidor";
          statusRetiro.className = "status danger";
          timerResetRetiro = setTimeout(() => resetFormulario("retiro"), 3500);
        } else {
          statusEntrega.innerText = "Error de conexión con el servidor";
          statusEntrega.className = "status danger";
          timerResetEntrega = setTimeout(() => resetFormulario("entrega"), 3500);
        }
        console.error(err);
      });
    }
  </script>
</body>
</html>
