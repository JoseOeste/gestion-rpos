<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Equipos RPOS</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f7;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .ripley-logo-box {
      display: inline-flex;
      align-items: center;
      background-color: #000;
      padding: 10px 18px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .ripley-text {
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 28px;
      letter-spacing: 12px;
      margin-right: -12px;
      font-weight: normal;
    }
    .ripley-dotcom {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #000;
      font-weight: bold;
      font-size: 14px;
      margin-left: 10px;
      font-family: Arial, sans-serif;
    }
    .ripley-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(to right, 
        #d9252e 0%, #d9252e 12%, #792a7e 12%, #792a7e 24%, 
        #f6cd00 24%, #f6cd00 36%, #cccccc 36%, #cccccc 48%, 
        #d9252e 48%, #d9252e 60%, #792a7e 60%, #792a7e 72%, 
        #f6cd00 72%, #f6cd00 84%, #d9252e 84%, #d9252e 100%
      );
    }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      background: #ebf5fb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label { font-weight: bold; font-size: 14px; color: #2c3e50; }
    input[type="date"] {
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      outline: none;
    }
    .btn-search {
      background-color: #2980b9; color: white; border: none; padding: 9px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    .btn-search:hover { background-color: #1f618d; }
    .btn-today {
      background-color: #27ae60; color: white; border: none; padding: 9px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
    }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #2c3e50; color: white; font-weight: 600; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
    .badge-retirado { background-color: #fce4e4; color: #c0392b; border: 1px solid #f9b7b7; }
    .badge-entregado { background-color: #e8f8f5; color: #27ae60; border: 1px solid #a3e4d7; }

    .status { padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; margin-top: 15px; display: none; }
    .danger { background-color: #f8d7da; color: #721c24; display: block; }
    .info { background-color: #d1ecf1; color: #0c5460; display: block; }

    .watermark {
      text-align: center; font-size: 11px; color: #95a5a6; margin-top: 25px; text-transform: uppercase; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div style="display: inline-flex; align-items: center;">
        <div class="ripley-logo-box">
          <span class="ripley-text">RIPLEY</span>
          <div class="ripley-bar"></div>
        </div>
        <span class="ripley-dotcom">.com</span>
      </div>
    </div>

    <h2>Auditoría & Visor de Equipos</h2>

    <div class="controls">
      <div class="control-group">
        <button class="btn-today" onclick="cargarDatosHoy()">📅 Ver Hoy</button>
      </div>
      <div class="control-group">
        <label for="fechaConsulta">Busca otra fecha:</label>
        <input type="date" id="fechaConsulta">
        <button class="btn-search" onclick="cargarDatosHistoricos()">🔍 Consultar</button>
      </div>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="table-responsive">
      <table id="tablaVisor">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Área</th>
            <th>Equipo</th>
            <th>Estado</th>
            <th>Hora Retiro</th>
            <th id="thDevolucion" style="display:none;">Hora Devolución</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla">
          <tr><td colspan="6" style="text-align:center;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="watermark">
      Desarrollado por Jose Manuel Jara Barbe &copy; 2026
    </div>
  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbymgKY0pIwUb26P0hmYa4UKBE3Phhr6uGbkf23X5qN_U82v_i0HGktXycP07sfbutf3_w/exec";

    document.addEventListener("DOMContentLoaded", function() {
      const inputFecha = document.getElementById("fechaConsulta");
      const hoyStr = new Date().toISOString().split("T")[0];
      inputFecha.max = hoyStr;

      cargarDatosHoy();
    });

    function mostrarMensaje(txt, clase) {
      const box = document.getElementById("statusBox");
      if (!txt) { box.style.display = "none"; return; }
      box.className = "status " + clase;
      box.innerText = txt;
    }

    function cargarDatosHoy() {
      mostrarMensaje("Cargando información del día...", "info");
      document.getElementById("thDevolucion").style.display = "none";

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "obtener_dia" })
      })
      .then(r => r.json())
      .then(res => {
        mostrarMensaje("", "");
        if (res.status === "OK") {
          renderizarTabla(res.datos, false);
        } else {
          mostrarMensaje(res.mensaje || "Error al obtener datos del día.", "danger");
        }
      })
      .catch(err => {
        mostrarMensaje("Error de conexión al obtener datos.", "danger");
        console.error(err);
      });
    }

    function cargarDatosHistoricos() {
      const inputFecha = document.getElementById("fechaConsulta");
      const fecha = inputFecha.value;

      if (!fecha) { 
        mostrarMensaje("Por favor seleccione una fecha.", "danger"); 
        return; 
      }

      const fechaSeleccionada = new Date(fecha + "T00:00:00");
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      if (fechaSeleccionada > hoy) {
        mostrarMensaje("⚠️ No se pueden consultar fechas futuras. Seleccione una fecha pasada o el día de hoy.", "danger");
        return;
      }

      mostrarMensaje("Buscando respaldo en Google Drive...", "info");

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "obtener_historico", fecha: fecha })
      })
      .then(r => r.json())
      .then(res => {
        mostrarMensaje("", "");
        if (res.status === "OK") {
          document.getElementById("thDevolucion").style.display = "table-cell";
          renderizarTabla(res.datos, true);
        } else {
          mostrarMensaje(res.mensaje, "danger");
        }
      })
      .catch(err => {
        mostrarMensaje("Error al consultar fecha histórica.", "danger");
        console.error(err);
      });
    }

    function renderizarTabla(datos, esHistorico) {
      const tbody = document.getElementById("cuerpoTabla");
      tbody.innerHTML = "";

      if (!datos || datos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${esHistorico ? 6 : 5}" style="text-align:center;">No hay registros para mostrar.</td></tr>`;
        return;
      }

      datos.forEach(item => {
        const tr = document.createElement("tr");
        const claseBadge = item.estado.toLowerCase() === "retirado" ? "badge-retirado" : "badge-entregado";

        let htmlRow = `
          <td>${item.nombre}</td>
          <td>${item.area}</td>
          <td><b>${item.equipo}</b></td>
          <td><span class="badge ${claseBadge}">${item.estado}</span></td>
          <td>${item.fechaRetiro}</td>
        `;

        if (esHistorico) {
          htmlRow += `<td>${item.fechaDevolucion || '-'}</td>`;
        }

        tr.innerHTML = htmlRow;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
