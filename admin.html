<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestión RPOS</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #1a252f; 
      margin: 0; 
      padding: 40px 20px; 
      color: #333;
    }
    body::before {
      content: "ADMINISTRACIÓN - JOSE MANUEL JARA";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 32px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.02);
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
    }
    .container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: white; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
      position: relative;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .ripley-logo-box {
      display: inline-flex;
      align-items: center;
      background-color: #000;
      padding: 12px 20px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .ripley-text {
      color: #ffffff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 32px;
      letter-spacing: 14px;
      margin-right: -14px;
      font-weight: normal;
    }
    .ripley-dotcom {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      margin-left: 12px;
      font-family: Arial, sans-serif;
    }
    .ripley-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(to right, 
        #d9252e 0%, #d9252e 12%, #792a7e 12%, #792a7e 24%, 
        #f6cd00 24%, #f6cd00 36%, #cccccc 36%, #cccccc 48%, 
        #d9252e 48%, #d9252e 60%, #792a7e 60%, #792a7e 72%, 
        #f6cd00 72%, #f6cd00 84%, #d9252e 84%, #d9252e 100%
      );
    }
    h2 { 
      text-align: center; color: #2c3e50; margin-top: 10px; margin-bottom: 25px; 
    }
    .admin-badge {
      background-color: #e74c3c;
      color: white;
      text-align: center;
      padding: 6px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .view-section { display: none; }
    .view-section.active { display: block; }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
    input { 
      width: 100%; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; outline: none; 
    }
    input:focus { border-color: #e74c3c; background-color: #fdfefe; }
    .btn-action {
      background-color: #e74c3c; color: white; width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s;
    }
    .btn-action:hover { background-color: #c0392b; }
    .btn-cierre { background-color: #27ae60; margin-top: 15px; }
    .btn-cierre:hover { background-color: #1e8449; }
    .status { padding: 14px; font-weight: bold; text-align: center; border-radius: 6px; margin-top: 20px; display: none; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
    .danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    .info-box {
      background-color: #ebf5fb; border-left: 4px solid #3498db; padding: 12px; font-size: 14px; color: #2980b9; margin-bottom: 20px; border-radius: 0 6px 6px 0;
    }
    .watermark {
      text-align: center; font-size: 11px; color: #7f8c8d; margin-top: 25px; text-transform: uppercase; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div style="display: inline-flex; align-items: center;">
        <div class="ripley-logo-box">
          <span class="ripley-text">RIPLEY</span>
          <div class="ripley-bar"></div>
        </div>
        <span class="ripley-dotcom">.com</span>
      </div>
    </div>

    <div class="admin-badge">Consola de Administración</div>

    <!-- SECCIÓN LOGIN -->
    <div id="viewLogin" class="view-section active">
      <h2>Acceso Restringido</h2>
      <div class="input-group">
        <label for="inputClave">Clave de Administrador:</label>
        <input type="password" id="inputClave" placeholder="Ingrese PIN..." autocomplete="current-password">
      </div>
      <button class="btn-action" onclick="validarLogin()">🔓 Ingresar</button>
      <div id="statusLogin" class="status"></div>
    </div>

    <!-- SECCIÓN PANEL DE CONTROL -->
    <div id="viewDashboard" class="view-section">
      <h2>Panel de Control</h2>
      <div class="info-box">
        ℹ️ Desde aquí puedes forzar el cierre manual de la jornada. El sistema validará que no queden equipos pendientes antes de respaldar en Drive.
      </div>
      <button class="btn-action btn-cierre" onclick="ejecutarCierreManual()">📦 Ejecutar Cierre y Respaldo Manual</button>
      <div id="statusDashboard" class="status"></div>
    </div>

    <div class="watermark">
      Desarrollado por Jose Manuel Jara Barbe &copy; 2026
    </div>
  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwdavfXoehjCXFE-HZhZUYHUah1BrTXjI61tmbQKwyUb73GO6CCUuFsLOdFaGVds7sKaw/exec";
    let claveGuardada = "";

    const viewLogin = document.getElementById("viewLogin");
    const viewDashboard = document.getElementById("viewDashboard");
    const inputClave = document.getElementById("inputClave");
    const statusLogin = document.getElementById("statusLogin");
    const statusDashboard = document.getElementById("statusDashboard");

    inputClave.addEventListener("keypress", function(e) {
      if (e.key === "Enter") { e.preventDefault(); validarLogin(); }
    });

    function validarLogin() {
      const clave = inputClave.value.trim();
      if (!clave) return;

      statusLogin.className = "status";
      statusLogin.style.display = "block";
      statusLogin.innerText = "Verificando acceso...";

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "admin_login", clave: clave })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "OK") {
          claveGuardada = clave;
          viewLogin.classList.remove("active");
          viewDashboard.classList.add("active");
        } else {
          statusLogin.innerText = res.mensaje || "Clave incorrecta";
          statusLogin.className = "status danger";
        }
      })
      .catch(err => {
        statusLogin.innerText = "Error de conexión con el servidor";
        statusLogin.className = "status danger";
        console.error(err);
      });
    }

    function ejecutarCierreManual() {
      if (!confirm("¿Estás seguro de ejecutar el cierre manual y respaldo de la jornada?")) return;

      statusDashboard.className = "status";
      statusDashboard.style.display = "block";
      statusDashboard.innerText = "⏳ Procesando respaldo en Google Drive...";

      fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "admin_cierre", clave: claveGuardada })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "OK") {
          statusDashboard.innerText = res.mensaje;
          statusDashboard.className = "status success";
        } else {
          statusDashboard.innerText = res.mensaje;
          statusDashboard.className = "status danger";
        }
      })
      .catch(err => {
        statusDashboard.innerText = "Error de conexión al procesar el cierre.";
        statusDashboard.className = "status danger";
        console.error(err);
      });
    }
  </script>
</body>
</html>
